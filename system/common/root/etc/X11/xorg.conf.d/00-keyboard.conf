# Written by systemd-localed(8), read by systemd-localed and Xorg. It's
# probably wise not to edit this file manually. Use localectl(1) to
# update this file.

# DEFAULT (without my custom fr_min file (only the XF86 keys I need))
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        MatchDevicePath "/dev/input/event*"
        Option "XkbLayout" "fr"
        Option "XkbOptions" "caps:escape"
        Option "AutoRepeat" "250 20" # linux bug, but AutoRepeat 250 30 matches xset r rate 250 50
EndSection

