# Rend /etc/polkit-1/rules.d traversable par les utilisateurs.
#
# polkit livre ce dossier en 0750 root:polkitd. C'est délibéré de leur part : ces
# règles décrivent qui a le droit de faire quoi sur la machine, et les lire
# renseigne sur la surface d'autorisation. Sur un poste personnel où le seul
# compte humain est déjà dans wheel, l'information n'apprend rien à personne, et
# 0750 a un coût concret : `dot status` ne peut pas vérifier les fichiers qu'il y
# a déployés et les signale comme non vérifiables à chaque appel.
#
# Un simple chmod serait défait à la prochaine mise à jour du paquet polkit.
# systemd-tmpfiles réapplique ceci à chaque démarrage.
#
# Le `z` ajuste un dossier existant sans le créer, ce qui est exactement ce qu'on
# veut ici : si polkit n'est pas installé, la ligne ne fait rien.
#
# Pour revenir en arrière : supprimer ce fichier, puis
#     sudo chmod 750 /etc/polkit-1/rules.d

z /etc/polkit-1/rules.d 0755 root polkitd - -
