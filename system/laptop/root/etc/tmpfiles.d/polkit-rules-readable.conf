# Makes /etc/polkit-1/rules.d traversable by users.
#
# polkit ships this folder as 0750 root:polkitd. That is deliberate on their side: these
# rules describe who may do what on the machine, and reading them
# tells about the authorization surface. On a personal computer where the only
# human account is already in wheel, the information teaches nobody anything, and
# 0750 has a concrete cost: `dot status` cannot check the files it has
# deployed there and reports them as unverifiable on every run.
#
# A plain chmod would be undone by the next polkit package update.
# systemd-tmpfiles applies this again on every boot.
#
# `z` adjusts an existing folder without creating it, which is exactly what is
# wanted here: if polkit is not installed, the line does nothing.
#
# To go back: delete this file, then
#     sudo chmod 750 /etc/polkit-1/rules.d

z /etc/polkit-1/rules.d 0755 root polkitd - -
