<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>lcddefault</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
    </match>

    <!-- Fallback for every family, the desktop default fonts included, so the
         Nerd Fonts icons render whatever font a terminal or an app asks for.
         Appended last: the letters still come from the requested font. -->
    <match target="pattern">
        <edit name="family" mode="append_last">
            <string>Symbols Nerd Font Mono</string>
        </edit>
    </match>

</fontconfig>
