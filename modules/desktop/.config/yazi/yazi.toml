#:schema https://yazi-rs.github.io/schemas/yazi.json

# Only what differs from yazi's own defaults. Everything else is inherited, so
# a yazi upgrade cannot break this file the way a full copy of the default did.

[mgr]
ratio    = [1, 3, 5]
sort_by  = "natural"
linemode = "size"

# # Alt+e: the image preview is a window laid over the terminal, not text,
# # so it ignores the tmux popup and goes to the top left. Corrected here, in
# # cells, [x, y, width, height]:
# #   [ 0, 0,  0,  0 ]  stuck to the terminal corner, overlaps the file list
# #   [ 2, 1, -2, -3 ]  right inside the popup   <-- current
# #   [ 8, 4,  0,  0 ]  too far, goes past the popup on the right
# #
# # The last 2 numbers shrink the box, so ueberzugpp resizes
# # the image a 2nd time and the text smears. The 2 lines above make up for it.
# # (No need to touch max_width/max_height: the target follows the rect, not them.)
# [preview]
# image_filter    = "lanczos3"   # default "triangle", softer
# image_quality   = 90           # default 75, the cache is a JPEG
# # ueberzug_offset = [ 2, 1, -2, -3 ]
# ueberzug_offset = [ 3, 2, 0, 0 ]

[opener]
edit = [
	{ run = 'nvim %s', desc = "nvim", block = true, for = "unix" },
]
play = [
	{ run = 'vlc %s', desc = "VLC", orphan = true, for = "unix" },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", desc = "Show media info", block = true, for = "unix" },
]
pdf = [
	{ run = 'pdf %s1',     desc = "Okular (default)", orphan = true, for = "linux" },
	{ run = 'pdfz %s1',    desc = "Zathura",          orphan = true, for = "linux" },
	{ run = 'firefox %s1', desc = "Firefox",          orphan = true, for = "linux" },
	{ run = 'jopdf %s1',   desc = "Jopdf",            orphan = true, for = "linux" },
]
image = [
	{ run = 'qimgv %s1',         desc = "qimgv (default)", orphan = true, for = "linux" },
	{ run = 'ristretto.sh %s1',  desc = "Ristretto",       orphan = true, for = "linux" },
	{ run = 'firefox %s1',       desc = "Firefox",         orphan = true, for = "linux" },
]

[open]
prepend_rules = [
	{ mime = "application/pdf", use = ["pdf", "reveal"] },
	{ mime = "image/*",         use = ["image", "reveal"] },
]

[tasks]
image_bound = [0, 0]

[plugin]
prepend_previewers = [
	{ mime = "image/svg+xml", run = "magick" },
	{ url = "*.{csv,tsv,json,parquet,txt,xlsx,db,duckdb}", run = "duckdb" },
]
prepend_spotters = [
	{ mime = "image/svg+xml", run = "magick" },
	{ url = "*.{csv,tsv,json,parquet,txt,xlsx}", run = "duckdb", multi = false },
	{ url = "*/", run = "spot-rich" },  # directories need their own glob
	{ url = "*", run = "spot-rich" },  # fallback, must stay last
]
prepend_preloaders = [
	{ mime = "image/svg+xml", run = "magick" },
]
