# ── Window ────────────────────────────────
window_padding_width 0
# The grid starts in the top-left corner, as in alacritty, rather than centred
# with the leftover pixels spread around it
placement_strategy top-left
# background_opacity 0.98
# hide_window_decorations yes
# Opens maximized, as alacritty does: kitty has no option for it, a session
# file is the only place that takes a window state.
startup_session maximized.session

# ── Colours ───────────────────────────────
background #080808
# background #0A0A0A
# background #000000
# alacritty's default foreground and palette, so the three terminals show the
# same colours
foreground #d8d8d8
color0  #181818
color1  #ac4242
color2  #90a959
color3  #f4bf75
color4  #6a9fb5
color5  #aa759f
color6  #75b5aa
color7  #d8d8d8
color8  #6b6b6b
color9  #c55555
color10 #aac474
color11 #feca88
color12 #82b8c8
color13 #c28cb8
color14 #93d3c3
color15 #f8f8f8

# ── Font ──────────────────────────────────
font_family      Roboto Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# FiraCode Nerd Font
# font_family JetBrainsMono Nerd Font

font_size 12.5

# ── Scrolling ─────────────────────────────
wheel_scroll_multiplier 5.0

# Half a page, which no scroll_* action does
map shift+up   remote_control scroll-window 0.5p-
map shift+down remote_control scroll-window 0.5p
map page_up    scroll_page_up
map page_down  scroll_page_down

scrollbar never
text_composition_strategy legacy
cursor_shape block
shell_integration no-cursor
enable_audio_bell no
cursor_blink_interval 0
cursor none
# As alacritty: the pointer stays while typing, and closing never asks
mouse_hide_wait 0
confirm_os_window_close 0

input_delay 0
repaint_delay 3
sync_to_monitor no
