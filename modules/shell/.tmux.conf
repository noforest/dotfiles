# set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:Tc"  # Enable true color
# pass OSC 8 hyperlinks through to alacritty (Shift+click to open)
set -as terminal-features ",*:hyperlinks"

# WARN: bypasses a warning for cc
set -g set-clipboard on
set -ag terminal-overrides ",*:Ms@"
set-hook -g pane-set-clipboard 'run-shell -b "tmux save-buffer - | xclip -selection clipboard -i"'

# THEME
set -g pane-border-style "fg=#698DDA"
set -g pane-active-border-style "bg=default fg=#698DDA"

set -g pane-border-style "fg=default"
set -g pane-active-border-style "bg=default fg=default"
# set -g status-bg black
# set -g status-fg white
# set -g window-status-current-style bg=white,fg=black,bold
# set -g status-interval 60
# set -g status-left-length 30
# set -g status-left '#[fg=green](#S) '
# set -g status-right '#[fg=white]%H:%M#[default]'


set -g allow-rename on
set -g set-titles on
set -g set-titles-string '#T'
setw -g mode-keys vi
set -g renumber-windows on
# set -gq allow-passthrough on
# set -g visual-activity off

set-option -g focus-events on


# GENERAL
set -g base-index 1
set-option -g history-limit 100000
set -g mouse on
set -s escape-time 0
unbind-key Escape
bind-key b set-option status
set-environment -g DISPLAY $DISPLAY

# PLUGINS
# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'noscript/tmux-mighty-scroll'

############################################################################################

# These are the default values used inside the plugin to achieve the preview shown above.
set -g @minimal-tmux-fg "#000000"
set -g @minimal-tmux-bg "#698DDA"
set -g @minimal-tmux-indicator-str "  #S  "
# expanded icon (fullscreen icon)
set -g @minimal-tmux-expanded-icon "󰊓 "
set -g status-right-length 100
set -g status-left-length 100
set -g @minimal-tmux-status-right "RAM: #{ram_percentage} | CPU: #{cpu_percentage} | %A %h-%d %H:%M "

# set -g @minimal-tmux-status-right "RAM: #(/home/for/.tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load -m 2 --interval 2) | CPU: #{cpu_percentage} | %A %h-%d %H:%M"

############################################################################################


# On a new machine, clone tpm and install the plugins above at the first start
# install_plugins reads the path tpm itself only sets further down
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


# KEYBINDS
set -g xterm-keys on


# # In normal mode: enter copy-mode and scroll
# bind -n C-Up   if -F "#{pane_in_mode}" "send-keys -X halfpage-up"   "copy-mode \; send-keys -X halfpage-up"
# bind -n C-Down if -F "#{pane_in_mode}" "send-keys -X halfpage-down" "copy-mode \; send-keys -X halfpage-down"
#
# # In copy-mode-vi: scroll only
# bind -T copy-mode-vi C-Up   send-keys -X halfpage-up
# bind -T copy-mode-vi C-Down send-keys -X halfpage-down
# Disable in normal mode
unbind -n C-Up
unbind -n C-Down

# Disable in copy-mode-vi
unbind -T copy-mode-vi C-Up
unbind -T copy-mode-vi C-Down

# Ctrl+s : toggle copy-mode
bind-key -n C-s if-shell -F "#{pane_in_mode}" \
    "send-keys C-c" \
    "copy-mode"

# Disables C-f when it is nvim
    bind-key -n C-f if-shell \
        '[ "#{pane_current_command}" = "nvim" ]' \
        'send-keys C-f' \
        'send-keys "fuzzy_cd\n"'

# # Disables C-d when it is nvim
#         bind-key -n C-d if-shell \
#             '[ "#{pane_current_command}" = "nvim" ]' \
#             'send-keys C-d' \
#             'send-keys "confirm-exit\n"'


# Visual selection (character by character)
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Visual line selection
bind-key -T copy-mode-vi V send-keys -X select-line
# Visual block selection (Ctrl-v)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

bind -n M-z next-window
bind -n M-a previous-window

# Alt+w  (M-w) close the current pane
bind -n M-w kill-pane

# Alt+j goes to the next pane
bind -n M-j select-pane -t :.+
# Alt+k goes to the previous pane
bind -n M-k select-pane -t :.-

# Clockwise rotation of the panes
bind -n M-J rotate-window -D

# Like nvim but with ALT instead of SPACE
bind -n M-v split-window -h -c "#{pane_current_path}"

bind -n M-s split-window -v -c "#{pane_current_path}"

# A floating pane rather than a popup: ueberzugpp (Alacritty's only image
# backend) places previews from TMUX_PANE, which a popup does not have.
# new-pane is tmux 3.7, older ones (Ubuntu) stop on it as an unknown command
%if "#{>=:#{version},3.7}"
bind -n M-e new-pane -c '#{pane_current_path}' -x 90% -y 88% -X 5% -Y 7% yazi
%endif



bind -n M-b set -g status

# Alt + Shift + Arrows to resize
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# Alt + Enter  or Alt + c: new window (current path)
# bind -n M-Enter new-window -c "#{pane_current_path}"
bind -n M-c new-window -a -c "#{pane_current_path}"

# bind -n M-Enter new-window
# # Alt + o: new window in the directory of the active window
# bind -n M-\* new-window -c "#{pane_current_path}"

# Goto window 1 to 5 using Alt + & é " ' (
bind -n -N "Goto window 1" M-& select-window -t 1
bind -n -N "Goto window 2" M-é select-window -t 2
bind -n -N "Goto window 3" M-\" select-window -t 3
bind -n -N "Goto window 4" M-\' select-window -t 4
bind -n -N "Goto window 5" M-\( select-window -t 5
bind -n -N "Goto window 6" M-\- select-window -t 6
bind -n -N "Goto window 7" M-\è select-window -t 7
bind -n -N "Goto window 8" M-\_ select-window -t 8
bind -n -N "Goto window 9" M-\ç select-window -t 9


set -g @yank_action "copy-pipe"


# Hook turning the status bar off for the float session
set-hook -g session-created 'if-shell "[ #{session_name} = float ]" "set-option -t float status off"'

bind -n M-f if-shell '[ "#{session_name}" != "float" ]' \
"display-popup -d '#{pane_current_path}' -x C -y C -h 89% -w 85% -E 'tmux new-session -A -s float" \
"display-message 'Cannot open a popup inside another popup!'"



# Move the current window to the left (wrapping around) (alt+shift+a)
bind -n M-A swap-window -t -1 \; select-window -t -1
# Move the current window to the right (wrapping around) (alt+shift+z)
bind -n M-Z swap-window -t +1 \; select-window -t +1
# send the current pane to a new window
# bind -n M-p break-pane

# Tries to join the pane to window X. 
# If the window does not exist (failure), break-pane to that index instead.
bind -n M-1 run-shell "tmux join-pane -h -t :1 || tmux break-pane -t 1"
bind -n M-2 run-shell "tmux join-pane -h -t :2 || tmux break-pane -t 2"
bind -n M-3 run-shell "tmux join-pane -h -t :3 || tmux break-pane -t 3"
bind -n M-4 run-shell "tmux join-pane -h -t :4 || tmux break-pane -t 4"
bind -n M-5 run-shell "tmux join-pane -h -t :5 || tmux break-pane -t 5"
bind -n M-6 run-shell "tmux join-pane -h -t :6 || tmux break-pane -t 6"
bind -n M-7 run-shell "tmux join-pane -h -t :7 || tmux break-pane -t 7"
bind -n M-8 run-shell "tmux join-pane -h -t :8 || tmux break-pane -t 8"
bind -n M-9 run-shell "tmux join-pane -h -t :9 || tmux break-pane -t 9"

# renumbers every window of the session, filling the gaps
bind -n M-r move-window -r

# ueberzugpp/yazi image previews: hide the overlay when its pane loses focus,
# redraw it when yazi gets the focus back.
set -g allow-passthrough on
set-option -g focus-events on

set-hook -g pane-focus-out 'run-shell "pkill -USR1 ueberzugpp 2>/dev/null || true"'
# An editor opened from yazi shares its process group, so the pane still reports
# "yazi": skip the redraw key while nvim owns the terminal.
set-hook -g pane-focus-in  'if-shell "[ \"#{pane_current_command}\" = yazi ] && ! pgrep -t #{s|/dev/||:pane_tty} -x nvim" "send-keys F5"'
set-hook -g 'pane-focus-in[1]' 'run-shell -b "~/.config/tmux/jump.sh record #{pane_id}"'

# pane jump list, like Ctrl-o / Ctrl-i in nvim
bind -n M-o run-shell -b "~/.config/tmux/jump.sh back"
bind -n M-i run-shell -b "~/.config/tmux/jump.sh forward"
