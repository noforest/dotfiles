set -g allow-rename on
set -g set-titles on
# "<Terminal>: <pane title>", the pane title being the path zsh sets (.zshrc).
# The name comes from what the terminal of each client answers about itself:
# ghostty and kitty give their name, alacritty gives nothing.
set -g set-titles-string '#{?#{m:ghostty*,#{client_termtype}},Ghostty,#{?#{m:kitty*,#{client_termtype}},Kitty,Alacritty}}: #T'
setw -g mode-keys vi
set -g renumber-windows on
# set -gq allow-passthrough on
# set -g visual-activity off

set-option -g focus-events on


# GENERAL
set -g base-index 1
set-option -g history-limit 100000
set -g mouse on
set -s escape-time 0
unbind-key Escape
bind-key b set-option status
set-environment -g DISPLAY $DISPLAY

# PLUGINS
# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'niksingh710/minimal-tmux-status'
# tmux 3.8 underlines the current window by default (the style was `default`
# up to 3.6a). The theme already marks it with a background colour.
set -g window-status-current-style default
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'noscript/tmux-mighty-scroll'

############################################################################################

# These are the default values used inside the plugin to achieve the preview shown above.
set -g @minimal-tmux-fg "#000000"
set -g @minimal-tmux-bg "#698DDA"
set -g @minimal-tmux-indicator-str "  #S  "
# between the session name and the right side, not in the middle of the
# terminal (absolute-centre, the plugin default), which overlaps the right side
set -g @minimal-tmux-justify "centre"
# expanded icon (fullscreen icon)
set -g @minimal-tmux-expanded-icon "󰊓 "
set -g status-right-length 100
set -g status-left-length 100
set -g @minimal-tmux-status-right "RAM: #{ram_percentage} | CPU: #{cpu_percentage} | %A %h-%d %H:%M "

# set -g @minimal-tmux-status-right "RAM: #(/home/for/.tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load -m 2 --interval 2) | CPU: #{cpu_percentage} | %A %h-%d %H:%M"

