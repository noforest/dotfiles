# Visual selection (character by character)
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Visual line selection
bind-key -T copy-mode-vi V send-keys -X select-line
# Visual block selection (Ctrl-v)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Not from the floating pane of Alt+E: see there.
bind -n M-z if -F '#{pane_floating_flag}' '' next-window
bind -n M-a if -F '#{pane_floating_flag}' '' previous-window

# Alt+w  (M-w) close the current pane
bind -n M-w kill-pane

# Alt+j goes to the next pane
bind -n M-j select-pane -t :.+
# Alt+k goes to the previous pane
bind -n M-k select-pane -t :.-

# Clockwise rotation of the panes
bind -n M-J rotate-window -D

# Like nvim but with ALT instead of SPACE
bind -n M-v split-window -h -c "#{pane_current_path}"

bind -n M-s split-window -v -c "#{pane_current_path}"

# A floating pane rather than a popup: ueberzugpp (Alacritty's only image
# backend) places previews from TMUX_PANE, which a popup does not have.
# new-pane is tmux 3.7. Ubuntu's 3.6a stops on it as an unknown command, so
# scripts/ubuntu-install-tmux.sh builds a newer tmux there; until it has run,
# Alt+E is a popup. yazi runs in a session of its own that the popup shows:
# started straight in the popup, it takes the whole 3.6a server down.
# No image reaches the terminal through a popup, under ghostty no more than
# under Alacritty: yazi sends sixel there, which tmux prints as
# "SIXEL IMAGE (38x11)++++" over the file list. The commented line is the
# alternative, a zoomed split that closes back onto the layout when yazi
# quits: a real pane, so the preview is the one of a plain yazi.
# -O makes the floating pane modal: it stays the active pane of its window, so
# nothing reaches the panes under it. The bindings still run, so the ones that
# leave the window test for the floating pane and do nothing from it: Alt+A,
# Alt+Z and the Alt+digit row would otherwise change window with yazi left
# open behind. -K would hand every key to yazi instead, the other bindings
# included. Alt+E itself is one of them: without the test a second Alt+E
# stacked another yazi on the first.
# -O is tmux 3.8: on 3.7 the key answered "unknown flag -O" and opened
# nothing, so that version keeps the plain floating pane.
%if "#{>=:#{version},3.8}"
bind -n M-e if -F '#{pane_floating_flag}' '' "new-pane -O -c '#{pane_current_path}' -x 90% -y 88% -X 5% -Y 7% yazi"
%elif "#{>=:#{version},3.7}"
bind -n M-e if -F '#{pane_floating_flag}' '' "new-pane -c '#{pane_current_path}' -x 90% -y 88% -X 5% -Y 7% yazi"
%else
bind -n M-e display-popup -E -d '#{pane_current_path}' -w 90% -h 88% 'tmux new-session yazi \; set status off'
# bind -n M-e split-window -Z -c '#{pane_current_path}' yazi
%endif



bind -n M-b set -g status

# Alt + Shift + Arrows to resize
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 5
bind -n M-S-Down  resize-pane -D 5

# Alt + Enter  or Alt + c: new window (current path)
# bind -n M-Enter new-window -c "#{pane_current_path}"
bind -n M-c new-window -a -c "#{pane_current_path}"

# bind -n M-Enter new-window
# # Alt + o: new window in the directory of the active window
# bind -n M-\* new-window -c "#{pane_current_path}"

# Goto window 1 to 5 using Alt + & é " ' (
bind -n -N "Goto window 1" M-& if -F '#{pane_floating_flag}' '' "select-window -t 1"
bind -n -N "Goto window 2" M-é if -F '#{pane_floating_flag}' '' "select-window -t 2"
bind -n -N "Goto window 3" M-\" if -F '#{pane_floating_flag}' '' "select-window -t 3"
bind -n -N "Goto window 4" M-\' if -F '#{pane_floating_flag}' '' "select-window -t 4"
bind -n -N "Goto window 5" M-\( if -F '#{pane_floating_flag}' '' "select-window -t 5"
bind -n -N "Goto window 6" M-\- if -F '#{pane_floating_flag}' '' "select-window -t 6"
bind -n -N "Goto window 7" M-\è if -F '#{pane_floating_flag}' '' "select-window -t 7"
# Alt+_ is also ESC _, the first two bytes of a kitty graphics reply. yazi asks
# ghostty and kitty for one at startup, and the binding ate those bytes: the
# rest of the reply reached yazi as keys and opened its shell prompt. Under
# those two terminals, a pane running yazi gets the key itself.
bind -n -N "Goto window 8" M-\_ if -F '#{&&:#{==:#{pane_current_command},yazi},#{m/r:^(ghostty|kitty),#{client_termtype}}}' 'send-keys M-_' "if -F '#{pane_floating_flag}' '' 'select-window -t 8'"
bind -n -N "Goto window 9" M-\ç if -F '#{pane_floating_flag}' '' "select-window -t 9"


set -g @yank_action "copy-pipe"


# Hook turning the status bar off for the float session
set-hook -g session-created 'if-shell "[ #{session_name} = float ]" "set-option -t float status off"'

bind -n M-f if-shell '[ "#{session_name}" != "float" ]' \
"display-popup -d '#{pane_current_path}' -x C -y C -h 89% -w 85% -E 'tmux new-session -A -s float" \
"display-message 'Cannot open a popup inside another popup!'"



# Move the current window to the left (wrapping around) (alt+shift+a)
bind -n M-A swap-window -t -1 \; select-window -t -1
# Move the current window to the right (wrapping around) (alt+shift+z)
bind -n M-Z swap-window -t +1 \; select-window -t +1
# send the current pane to a new window
# bind -n M-p break-pane

# Tries to join the pane to window X. 
# If the window does not exist (failure), break-pane to that index instead.
bind -n M-1 run-shell "tmux join-pane -h -t :1 || tmux break-pane -t 1"
bind -n M-2 run-shell "tmux join-pane -h -t :2 || tmux break-pane -t 2"
bind -n M-3 run-shell "tmux join-pane -h -t :3 || tmux break-pane -t 3"
bind -n M-4 run-shell "tmux join-pane -h -t :4 || tmux break-pane -t 4"
bind -n M-5 run-shell "tmux join-pane -h -t :5 || tmux break-pane -t 5"
bind -n M-6 run-shell "tmux join-pane -h -t :6 || tmux break-pane -t 6"
bind -n M-7 run-shell "tmux join-pane -h -t :7 || tmux break-pane -t 7"
bind -n M-8 run-shell "tmux join-pane -h -t :8 || tmux break-pane -t 8"
bind -n M-9 run-shell "tmux join-pane -h -t :9 || tmux break-pane -t 9"

# renumbers every window of the session, filling the gaps
bind -n M-r move-window -r

# ueberzugpp/yazi image previews: hide the overlay when its pane loses focus,
# redraw it when yazi gets the focus back.
set -g allow-passthrough on
set-option -g focus-events on
# yazi picks its image protocol from these two under tmux. A pane otherwise
# inherits them from the terminal the server was started in: a server born in
# Alacritty kept TERM=alacritty and no TERM_PROGRAM for the ghostty attached to
# it later, and yazi drew no preview there. Listed here, they follow the client.
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set-hook -g pane-focus-out 'run-shell "pkill -USR1 ueberzugpp 2>/dev/null || true"'
# An editor opened from yazi shares its process group, so the pane still reports
# "yazi": skip the redraw key while nvim owns the terminal.
# Not under ghostty: yazi draws with the kitty protocol there, not ueberzugpp,
# and tmux brings the image back by itself. The key only made the preview
# render a second time, visibly, each time the pane was left and came back.
set-hook -g pane-focus-in  'if-shell "[ \"#{m:ghostty*,#{client_termtype}}\" != 1 ] && [ \"#{pane_current_command}\" = yazi ] && ! pgrep -t #{s|/dev/||:pane_tty} -x nvim" "send-keys F5"'
set-hook -g 'pane-focus-in[1]' 'run-shell -b "~/.config/tmux/jump.sh record #{pane_id}"'

# pane jump list, like Ctrl-o / Ctrl-i in nvim
bind -n M-o run-shell -b "~/.config/tmux/jump.sh back"
bind -n M-i run-shell -b "~/.config/tmux/jump.sh forward"
