# The stock Ubuntu prompt, user@host:path$, with the git branch and status
# before the $ and the command duration on the right. For Ubuntu, see .zshrc.
#
#   (.venv) user@host:~/dir  [main][!?]$                         [9m25s]

format = '${custom.venv}$username$hostname:$directory$git_branch$git_state$git_status$character'
right_format = '$cmd_duration'

add_newline = false

# The name of an activated project venv, in front like activate's own (.venv),
# which starship's prompt replaces. ~/.venv is left out: it is the default
# environment of every shell (on PATH from ~/.zshrc.local), so showing it would
# say nothing. The python module cannot compare paths, hence a custom module;
# `when` costs one sh per prompt.
[custom.venv]
when = '[ -n "$VIRTUAL_ENV" ] && [ "$VIRTUAL_ENV" != "$HOME/.venv" ]'
command = 'echo "${VIRTUAL_ENV##*/}"'
shell = ['sh']
format = '(\($output\) )'

[username]
show_always = true
format = '[$user@](bold green)'

[hostname]
ssh_only = false
ssh_symbol = ''
format = '[$hostname](bold green)'

[directory]
format = '[$path](bold blue)'
truncate_to_repo = false
truncation_length = 100
truncation_symbol = ''
read_only = ''

[git_branch]
format = ' [\[$branch\]](211)'

[git_state]
format = '[\[$state( $progress_current/$progress_total)\]](211)'

[git_status]
format = '([\[$all_status$ahead_behind\]](211))'

[cmd_duration]
min_time = 5000
format = ' \[$duration\]'

[character]
format = '$symbol '
success_symbol = '\$'
error_symbol = '\$'
vimcmd_symbol = '\$'
