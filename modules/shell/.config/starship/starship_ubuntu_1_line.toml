# The stock Ubuntu prompt, user@host:path$, with the git branch and status
# before the $ and the command duration on the right. For Ubuntu, see .zshrc.
#
#   user@host:~/dir  [main][!?]$                                 [9m25s]

format = '$username$hostname:$directory$git_branch$git_state$git_status$character'
right_format = '$cmd_duration'

add_newline = false

[username]
show_always = true
format = '[$user@](bold green)'

[hostname]
ssh_only = false
ssh_symbol = ''
format = '[$hostname](bold green)'

[directory]
format = '[$path](bold blue)'
truncate_to_repo = false
truncation_length = 100
truncation_symbol = ''
read_only = ''

[git_branch]
format = '  [\[$branch\]](211)'

[git_state]
format = '[\[$state( $progress_current/$progress_total)\]](211)'

[git_status]
format = '([\[$all_status$ahead_behind\]](211))'

[cmd_duration]
min_time = 5000
format = ' \[$duration\]'

[character]
format = '$symbol '
success_symbol = '\$'
error_symbol = '\$'
vimcmd_symbol = '\$'
