# The stock Ubuntu prompt, user@host:path$, with the git branch, the git
# status and the command duration on the right. For Ubuntu, see .zshrc.
#
#   user@host:~/dir$                              main [!?] [3s]

format = '$username$hostname:$directory$character'
right_format = '$git_branch$git_state$git_status$cmd_duration'

add_newline = false

[username]
show_always = true
format = '[$user@](bold green)'

[hostname]
ssh_only = false
ssh_symbol = ''
format = '[$hostname](bold green)'

[directory]
format = '[$path](bold blue)'
truncate_to_repo = false
truncation_length = 100
truncation_symbol = ''
read_only = ''

[git_branch]
format = ' $branch'

[git_state]
format = ' \($state( $progress_current/$progress_total)\)'

[git_status]
format = '( \[$all_status$ahead_behind\])'

[cmd_duration]
format = ' \[$duration\]'

[character]
format = '$symbol '
success_symbol = '\$'
error_symbol = '\$'
vimcmd_symbol = '\$'
