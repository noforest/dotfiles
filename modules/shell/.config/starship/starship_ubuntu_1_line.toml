# Flat prompt on one line, in the terminal's own colors, no powerline
# segments or background colors. For Ubuntu, see .zshrc.
#
#   user@host ~/dir  main [!?] 3s ❯

format = '$username$hostname$directory$git_branch$git_state$git_status$cmd_duration$character'

add_newline = true

[username]
show_always = true
format = '[$user](bold green)'

[hostname]
ssh_only = false
ssh_symbol = ''
format = '[@$hostname](bold green) '

[directory]
format = '[$path](bold blue)[$read_only](red) '
read_only = ' 󰌾'
truncation_length = 8
truncation_symbol = ''

[git_branch]
format = '[$symbol$branch](bold purple) '
symbol = ' '

[git_state]
format = '[\($state( $progress_current/$progress_total)\)](bold yellow) '

[git_status]
format = '([\[$all_status$ahead_behind\]](bold red) )'

[cmd_duration]
format = '[$duration](yellow) '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
