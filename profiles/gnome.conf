# Profile "gnome", a tower on the desktop its distribution ships (GNOME on
# Ubuntu), without dwm.
#
# Same as `desktop`, minus everything dwm: the `x11-dwm` module, package group
# and system scope, ly, and the build-suckless step. xset-r-rate gives way to
# the gnome-settings step, since GNOME ignores xset.
#
# To do after bootstrapping:
#   - echo gnome > machine.d/<hostname>.conf, so the profile stops being a guess

packages: core shell fonts desktop hardware dev
system: peripherals
services: NetworkManager docker
steps: install login-shell link system-apply services fonts nvim-patch yazi-plugins gnome-settings
aur: yes

shell
git
nvim
vim
terminal
x11-common
desktop
dev
