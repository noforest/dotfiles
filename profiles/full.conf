# Profile "full", laptop plus the whole development toolchain and the rest.
# Around a hundred extra packages (XFCE, Hyprland, security, virtualisation).
# Arch only in practice: packages/ubuntu/ has no dev.txt nor extra.txt yet, and
# a missing group is skipped silently.

packages: core shell nvim fonts x11-dwm desktop hardware laptop dev extra backup
system: laptop x11-dwm peripherals backup sync
services: ly@tty2 NetworkManager acpid xset-r-rate docker cups
aur: yes

shell
git
nvim
vim
terminal
x11-common
x11-dwm
desktop
laptop
dev
