# Profile "laptop", the complete dwm environment.
# This is the profile of this machine, and the one to use on a new laptop.
# Distribution neutral: `aur:` below is Arch only and is ignored elsewhere.

packages: core shell fonts x11-dwm desktop hardware laptop dev
system: laptop x11-dwm peripherals
services: ly@tty2 NetworkManager NetworkManager-dispatcher acpid xset-r-rate docker
aur: yes

shell
git
nvim
vim
terminal
x11-common
x11-dwm
desktop
laptop
dev
