# Profile "desktop", a tower PC running dwm.
#
# Same as `laptop`, minus everything that only makes sense on a portable
# machine: battery, backlight, touchpad, gestures, suspend on lid close,
# fingerprint reader.
#
# The `laptop` module is therefore absent, and so is the `laptop` package
# group. Both give way to `hardware`: sound, network, USB, wireless mice and
# keyboards, backup.
#
# Works on any distribution: the package directory and the distribution scope of
# system/ both follow /etc/os-release. `aur:` below is Arch only and is ignored
# everywhere else.
#
# To do after bootstrapping a tower:
#   - echo desktop > machine.d/<hostname>.conf, so the profile stops being a guess
#   - modules/x11-dwm/.config/dwm/machine.d/<hostname>.sh for xinput, often empty
#     on a tower (no touchpad to tune). Not the same file as the one above.

packages: core shell fonts x11-dwm desktop hardware dev
system: x11-dwm peripherals
aur: yes

shell
git
nvim
vim
terminal
x11-common
x11-dwm
desktop
dev
