# Profil « desktop » — un PC fixe sous dwm.
#
# Identique à `laptop`, moins tout ce qui n'a de sens que sur un portable :
# batterie, luminosité, pavé tactile, gestes, veille sur fermeture du capot,
# empreinte digitale, périphériques Logitech sans fil.
#
# Le module `laptop` est donc absent, et le groupe de paquets `laptop` aussi —
# remplacés par `hardware`, qui ne garde que le son, le réseau et l'USB.
#
# À faire après le bootstrap sur un fixe :
#   - retirer le bloc batterie de suckless/dwmblocks/blocks.h (vap-battery)
#   - créer machine.d/<hostname>.sh (pas de pavé tactile à régler, souvent vide)

packages: core shell fonts x11-dwm desktop hardware
aur: yes

shell
git
nvim
terminal
x11-dwm
desktop
