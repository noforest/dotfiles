# Profile "desktop", a tower PC running dwm.
#
# Same as `laptop`, minus everything that only makes sense on a portable
# machine: battery, backlight, touchpad, gestures, suspend on lid close,
# fingerprint reader, wireless Logitech devices.
#
# The `laptop` module is therefore absent, and so is the `laptop` package
# group. Both give way to `hardware`, which keeps only sound, network and USB.
#
# To do after bootstrapping a tower:
#   - remove the battery block from suckless/dwmblocks/blocks.h (vap-battery)
#   - create machine.d/<hostname>.sh (no touchpad to tune, so often empty)

packages: core shell fonts x11-dwm desktop hardware
aur: yes

shell
git
nvim
terminal
x11-dwm
desktop
